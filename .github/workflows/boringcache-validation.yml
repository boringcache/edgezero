name: BoringCache native GHA comparison
run-name: EdgeZero native compiler storage comparison
on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release override
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: edgezero-native-gha-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold:
    name: ${{ matrix.provider }} edgezero cold sample ${{ matrix.sample }}
    if: github.repository == 'boringcache/edgezero' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
        provider: [github, boringcache]
    permissions:
      contents: read
      id-token: write
    env:
      PROSPECT: edgezero
      PROVIDER: ${{ matrix.provider }}
      PHASE: cold
      UPSTREAM_SHA: 22fbbf2a727d83f2e31fd86d2d1dc5ebfba1b071
      ACTION_SHA: bd4cc7ce6d7a85933def03390f90654da7f84eef
      CACHE_SERIES: edgezero-native-gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.sample }}
    steps:
      - name: Checkout validation configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - name: Checkout pinned deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ACTION_SHA }}
          path: edgezero
          persist-credentials: false
      - name: Checkout pinned application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IABTechLab/trusted-server
          ref: ${{ env.UPSTREAM_SHA }}
          path: application
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: boringcache/benchmarks
          ref: 3869ca64b0dcb5befeeecd300c20a1b0b86cdaa3
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: sccache@0.17.0
      - name: Prepare jq and cache identity
        shell: bash
        run: |
          mkdir -p benchmark-tools
          curl --fail --location --retry 3 https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o benchmark-tools/jq
          echo '020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  benchmark-tools/jq' | sha256sum --check
          chmod +x benchmark-tools/jq
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          plan = Path('validation/.github/native-gha/.boringcache.toml')
          plan.write_text(plan.read_text().replace('edgezero-native-gha-series', os.environ['CACHE_SERIES']))
          PYCODE
      - name: Prepare isolated compiler
        env:
          BENCHMARK_SECRET_SENTINEL: benchmark-only-sentinel
        run: python3 validation/.github/native-gha/edgezero-container.py prepare
      - name: Configure native GitHub Actions compiler storage
        if: matrix.provider == 'github'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            core.exportVariable('SCCACHE_GHA_VERSION', process.env.CACHE_SERIES);
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_WRITE');
      - name: Configure BoringCache compiler storage
        if: matrix.provider == 'boringcache'
        id: cache
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: sccache
          working-directory: validation/.github/native-gha
          trust-policy: publish
          fail-on-cache-error: true
          diagnostics: summary
      - name: Measure the CLI producer build
        env:
          # Both compilers use an isolated daemon inside the build container.
          SCCACHE_SERVER_PORT: '4227'
        working-directory: edgezero
        run: python3 ../harness/scripts/prospects/measure-command.py build -- python3 ../validation/.github/native-gha/edgezero-container.py build
      - name: Verify application artifact without network or credentials
        run: python3 validation/.github/native-gha/edgezero-container.py verify
      - name: Remove isolated compiler and temporary state
        if: always()
        run: python3 validation/.github/native-gha/edgezero-container.py cleanup
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edgezero-${{ matrix.provider }}-cold-sample-${{ matrix.sample }}
          path: |
            ${{ runner.temp }}/prospect-evidence
            ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
  warm:
    name: ${{ matrix.provider }} edgezero warm sample ${{ matrix.sample }}
    if: github.repository == 'boringcache/edgezero' && github.ref == 'refs/heads/boringcache-validation'
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
