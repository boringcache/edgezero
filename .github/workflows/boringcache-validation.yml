            core.exportVariable('SCCACHE_GHA_VERSION', process.env.CACHE_SERIES);
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_ONLY');
      - name: Configure BoringCache compiler storage
        if: matrix.provider == 'boringcache'
